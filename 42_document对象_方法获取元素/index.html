<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document师姐</title>
</head>
<body>

    <div>hello1</div>
    <div class="text">hello2</div>

    <p class="book">hello world</p>

    <form name="login"> flj</form>

    <div id="root">哼哈二将</div>

    <div class="nav">nav1</div>
    <div class="nav">nav2</div>

    <script>
        var div1 = document.getElementsByTagName("div")[0];
        // div1.innerHTML = "hello world";
        console.log(div1);

        var text = document.getElementsByClassName('text');
       // text.innerHTML = "hello!"
        console.log(text);

        //使用率极低
        var name = document.getElementsByName("login");
        console.log(name);

        var root = document.getElementById("root");
        // root.innerHTML = "呵呵呵";
        console.log(root);

        var nav =document.querySelector(".nav")
        // nav.innerHTML = "nav11"
        console.log(nav);

        var navs = document.querySelectorAll("#root");
        console.log(navs);


    </script>
    
</body>
</html>
