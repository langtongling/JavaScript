<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h3{
            height: 400px;
        }
    </style>
</head>
<body>
    <h3>哈哈哈哈</h3>
    <h3>哈哈哈哈</h3>
    <h3>哈哈哈哈</h3>
    <h3>哈哈哈哈</h3>

    <script>

        function debounce(fn,delay){
            var timer = null;
            return function(){
                if(timer){
                    clearTimeout(timer);
                }
                timer = setTimeout(fn,delay);
            }
        }

        function scrollHandle(){
            console.log("滚动条位置：" + document.documentElement.scrollTop);
        }

        window.onscroll = debounce(scrollHandle,1000);


    </script>
</body>
</html>
